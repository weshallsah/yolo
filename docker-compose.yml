services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_CORS_ORIGIN: http://localhost:5173
      APP_DETECTION_CONFIDENCE_THRESHOLD: "0.2"
      APP_YOLO_WEIGHTS_PATH: models/abo_yolo/weights/best.pt
    ports:
      - "9000:9000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:9000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
